apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-app
  namespace: expense-tracker
spec:
  template:
    spec:
      containers:
      - name: expense-tracker
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: LOG_LEVEL
          value: "debug"
        - name: ENVIRONMENT
          value: "development"
