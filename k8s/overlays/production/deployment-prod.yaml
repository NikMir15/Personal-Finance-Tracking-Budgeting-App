apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-app
  namespace: expense-tracker
spec:
  template:
    spec:
      containers:
      - name: expense-tracker
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: ENVIRONMENT
          value: "production"
        - name: WORKERS
          value: "4"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: expense-tracker
spec:
  template:
    spec:
      containers:
      - name: mysql
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --innodb-buffer-pool-size=512M
        - --max-connections=200
