apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-tracker-config
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: config
data:
  # Database configuration
  MYSQL_HOST: "mysql-service"
  MYSQL_PORT: "3306"
  MYSQL_USER: "expense_user"
  MYSQL_DATABASE: "expense_tracker"
  
  # JWT configuration
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  
  # Application configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  WORKERS: "4"
  
  # OCR configuration
  TESSERACT_CMD: "/usr/bin/tesseract"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: database
data:
  MYSQL_DATABASE: "expense_tracker"
  MYSQL_USER: "expense_user"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: proxy
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
        
        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        client_max_body_size 10M;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
        
        # Upstream
        upstream expense_tracker_backend {
            server expense-tracker-service:8000;
            keepalive 32;
        }
        
        server {
            listen 80;
            server_name _;
            
            # Health check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # Auth endpoints with rate limiting
            location ~ ^/(auth/login|auth/signup) {
                limit_req zone=auth burst=3 nodelay;
                proxy_pass http://expense_tracker_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Upload endpoints with larger body size
            location /upload/ {
                client_max_body_size 50M;
                proxy_pass http://expense_tracker_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }
            
            # Static files with caching
            location /static/ {
                proxy_pass http://expense_tracker_backend;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
            
            # All other locations
            location / {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://expense_tracker_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
        }
    }
