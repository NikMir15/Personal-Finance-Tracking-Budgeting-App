apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-app
  namespace: expense-tracker
spec:
  template:
    spec:
      containers:
      - name: expense-tracker
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: expense-tracker
spec:
  template:
    spec:
      containers:
      - name: mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
