apiVersion: v1
kind: Secret
metadata:
  name: expense-tracker-secrets
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: config
type: Opaque
data:
  # Database credentials (base64 encoded)
  # To encode: echo -n "your_password" | base64
  MYSQL_ROOT_PASSWORD: Y2hhbmdlX21lX3BsZWFzZQ==  # change_me_please
  MYSQL_PASSWORD: Y2hhbmdlX21lX3BsZWFzZQ==      # change_me_please
  
  # JWT Secret Key (base64 encoded)
  # Generate: python -c "import secrets; print(secrets.token_urlsafe(32))" | base64
  SECRET_KEY: Y2hhbmdlX21lX3RvX2FfcmFuZG9tX3NlY3JldF9rZXk=  # change_me_to_a_random_secret_key
  
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: database
type: Opaque
data:
  # MySQL root password
  mysql-root-password: Y2hhbmdlX21lX3BsZWFzZQ==  # change_me_please
  mysql-password: Y2hhbmdlX21lX3BsZWFzZQ==      # change_me_please
